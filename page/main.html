<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coffee rush</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <!-- 상단 헤더 -->
    <header>
        <div class="logo-wrap">
            <img class="logo" src="../logo/logo_main .svg" alt="logo">
            <h1>커피러시</h1>
        </div>
        
            <button type="button" class="log">로그인</button>
           <!-- <div class="log">로그인</div> -->
        
        
    </header>

    <!-- 중앙 히어로 메인 섹션 -->
    <main class="main-content">
        <img class="cup" src="../logo/커피 아이콘.svg" alt="cup">

        <h2 class="main-title">혼자서도, 컵 3개로 승부를 본다</h2>
        <p class="sub-title">4단 주문 큐가 밀려오기 전에, 컵을 채우세요</p>

        <div class="btn-group">
            <button type="submit" class="btn-start">게임 시작</button>
            <button type="submit" class="btn-rule">게임 방법</button>
        </div>
    </main>

    <!-- 하단 4대 메커니즘 & 원작 표기 영역 -->
    <section class="mechanism-section">
        <div class="features">
            <div class="feature-item">
                <img src="../logo/mechanism_1.svg" alt="4단 주문 큐">
                <h3>4단 주문 큐</h3>
                <p>쌓이면 벌점</p>
            </div>
            <div class="feature-item">
                <img src="../logo/mechanism_2.svg" alt="컵 3개">
                <h3>컵 3개</h3>
                <p>동시 제작</p>
            </div>
            <div class="feature-item">
                <img src="../logo/mechanism_3.svg" alt="러시 토큰">
                <h3>러시 토큰</h3>
                <p>추가 이동</p>
            </div>
            <div class="feature-item">
                <img src="../logo/mechanism_4.svg" alt="업그레이드">
                <h3>업그레이드</h3>
                <p>영구 효과</p>
            </div>
        </div>

        <div class="original-wrap">
            <p class="original-text">원작: 「커피 러시」(기획 황의진 · 코리아보드게임즈)</p>
        </div>
    </section>

    <!-- 맨 하단 커피러시 웹 정보 영역 (#EFE8DC) -->
    <footer class="bottom-footer">
        <p class="web-info">커피 러시 웹 · v0.1 (MVP)</p>
    </footer>
</body>
</html>
